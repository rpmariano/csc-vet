<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>CSC Veteranos</title>
    <script type="text/javascript">
      // Redirecionamento SPA para GitHub Pages (spa-github-pages)
      // Mantém caminhos e parâmetros de pesquisa para aplicações de página única (SPA).
      // Se o repositório estiver alojado num subdiretório (ex: /csc-vet/), mantemos 1 segmento.
      var pathSegmentsToKeep = window.location.pathname.startsWith('/csc-vet') ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #262d2b;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .loader {
        padding: 24px;
      }
      a {
        color: #c5a059;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <p>A carregar...</p>
      <p style="font-size: 13px; opacity: 0.7;">
        Se não fores redirecionado automaticamente, <a href="/csc-vet/">clica aqui para entrar</a>.
      </p>
    </div>
  </body>
</html>
