name: Enviar avisos

# O relógio dos avisos.
#
# A base calcula a fila (`avisos_pendentes()`) e a Edge Function entrega —
# falta quem lhes bata à porta de tempos a tempos. Fica aqui e não no
# `pg_cron` porque as extensões `pg_cron`/`pg_net` não estão instaladas neste
# projeto, e o repositório já usa Actions para o deploy: é menos uma coisa a
# manter noutro sítio.
#
# De 15 em 15 minutos entre as 7h e as 23h (UTC). O silêncio da noite de cada
# pessoa é respeitado dentro da consulta, com a hora de Lisboa — isto é só
# para não acordar o servidor de madrugada à toa.
#
# Precisa de dois segredos no repositório:
#   SUPABASE_FUNCTION_URL   https://vwvsfrzwcwdvbuaxftoh.supabase.co/functions/v1/enviar-avisos
#   SUPABASE_SERVICE_ROLE_KEY
#
# A chave de serviço dá acesso total à base: é só do repositório, e nunca vai
# para o bundle da app. Ver `docs/avisos-push.md`.

on:
  schedule:
    - cron: '*/15 7-23 * * *'
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      # Um segredo em falta ou mal colado chega ao `curl` como lixo, e o curl
      # responde "exit code 3" (URL malformada) — um número que não diz a
      # ninguém o que é preciso fazer. E o GitHub mascara o valor no log, por
      # isso nem se vê o que lá está: o que se pode fazer é examinar a forma e
      # descrever o defeito sem o imprimir.
      - name: Confirmar os segredos
        env:
          URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          CHAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          falta=0

          if [ -z "$URL" ]; then
            echo "::error::Falta o segredo SUPABASE_FUNCTION_URL."
            echo "   Settings > Secrets and variables > Actions > New repository secret"
            echo "   Nome:  SUPABASE_FUNCTION_URL"
            echo "   Valor: https://vwvsfrzwcwdvbuaxftoh.supabase.co/functions/v1/enviar-avisos"
            falta=1
          else
            echo "SUPABASE_FUNCTION_URL tem $(printf %s "$URL" | wc -c) caracteres (devem ser 67)."
            case "$URL" in
              https://*) ;;
              *) echo "::error::Nao comeca por https:// - falta o esquema, ou ficaram aspas coladas ao valor."
                 falta=1 ;;
            esac
            case "$URL" in
              *" "*) echo "::error::Tem um espaco. Cola a URL sem espacos a volta."
                     falta=1 ;;
            esac
            case "$URL" in
              *'"'*|*"'"*) echo "::error::Tem aspas no valor. O campo do GitHub nao as leva."
                           falta=1 ;;
            esac
            case "$URL" in
              */functions/v1/enviar-avisos) ;;
              *) echo "::error::Nao acaba em /functions/v1/enviar-avisos."
                 falta=1 ;;
            esac
            if [ "$(printf %s "$URL" | wc -l)" -gt 0 ]; then
              echo "::error::Tem uma quebra de linha. Cola a URL numa linha so."
              falta=1
            fi
          fi

          if [ -z "$CHAVE" ]; then
            echo "::error::Falta o segredo SUPABASE_SERVICE_ROLE_KEY."
            echo "   E a chave service_role, em Project Settings > API Keys no Supabase."
            falta=1
          else
            echo "SUPABASE_SERVICE_ROLE_KEY tem $(printf %s "$CHAVE" | wc -c) caracteres."
          fi

          [ "$falta" -eq 0 ] || exit 1
          echo "Os dois segredos tem a forma certa."

      - name: Chamar a função de envio
        env:
          URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          CHAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # `-w` no fim para o código HTTP aparecer no log mesmo quando corre
          # bem: sem ele, um 200 com `{"enviados":0}` e um 401 são igualmente
          # silenciosos.
          resposta=$(curl --silent --show-error --max-time 120 \
            -w '\nHTTP %{http_code}\n' \
            -X POST "$URL" \
            -H "Authorization: Bearer $CHAVE" \
            -H "Content-Type: application/json")
          echo "$resposta"
          echo "$resposta" | grep -q 'HTTP 200' || {
            echo "::error::A funcao respondeu com erro. Ve a resposta acima."
            exit 1
          }
